name: PR Tests & Security Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Robolectric & Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit NPM Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=high || echo "NPM audit completed with warnings"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Android Lint Check
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug --no-daemon || echo "Lint finished with warnings"

  auto-merge:
    name: Auto-Merge PR (on Success)
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Checking auto-merge for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --merge || gh pr merge "$PR_NUMBER" --merge || echo "Auto-merge deferred to branch protection rules"
